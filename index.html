<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職業安全衛生線上測驗</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .step-section { display: none; }
    .step-section.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button.btn:hover { opacity: 0.9; }
    .question-card {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary-color);
    }
    .question-title { font-weight: bold; margin-bottom: 10px; }
    .option-label { display: block; margin: 8px 0; cursor: pointer; }

    /* 彈窗樣式 */
    .custom-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .custom-modal-overlay.active { display: flex; }
    .custom-modal {
      background: white; padding: 20px; border-radius: 8px; max-width: 80%; width: 300px; text-align: center;
    }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .modal-btn { margin-top: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }

    /* Loading 遮罩 */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8);
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <h2>職業安全衛生測驗系統</h2>

  <!-- Step 1: 填寫基本資料 -->
  <div id="step1" class="step-section active">
    <div class="form-group">
      <label for="watchClass">是否已看過課程影片？</label>
      <select id="watchClass">
        <option value="">-- 請選擇 --</option>
        <option value="是">是</option>
        <option value="否">否</option>
      </select>
    </div>
    <div class="form-group">
      <label for="name">姓名：</label>
      <input type="text" id="name" placeholder="請輸入姓名">
    </div>
    <div class="form-group">
      <label for="phone">手機號碼：</label>
      <input type="text" id="phone" placeholder="請輸入手機號碼">
    </div>
    <button class="btn" onclick="goToQuiz()">開始測驗</button>
  </div>

  <!-- Step 2: 測驗題目區塊 -->
  <div id="step2" class="step-section">
    <div id="quizContainer"></div>
    <button class="btn" onclick="submitQuiz()">提交答案</button>
  </div>
</div>

<!-- 自定義警告彈窗 (修正 modalTitle id) -->
<div class="custom-modal-overlay" id="customModal">
  <div class="custom-modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title" id="modalTitle">警告</div>
    <div class="modal-message" id="modalText">說明訊息</div>
    <button class="modal-btn" onclick="closeModal()">我知道了</button>
  </div>
</div>

<!-- 載入中遮罩 -->
<div id="loading" class="loading-overlay hidden">
  <div class="spinner"></div>
  <p style="margin-top: 10px; font-weight: bold;">資料載入中，請稍候...</p>
</div>

<script>
  // 請更換為你的 Cloudflare Worker 或 GAS Web App URL
  const API_URL = 'https://YOUR_WORKER_DOMAIN.workers.dev/'; 

  function showCustomModal(msg, title = '提示') {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalText').innerText = msg;
    document.getElementById('customModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('active');
  }

  function showLoading(show) {
    const loading = document.getElementById('loading');
    if (show) loading.classList.remove('hidden');
    else loading.classList.add('hidden');
  }

  function goToQuiz() {
    const watchClass = document.getElementById('watchClass').value;
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!watchClass) {
      showCustomModal('請選擇是否已看過課程影片');
      return;
    }
    if (!name || !phone) {
      showCustomModal('請填寫姓名與手機號碼');
      return;
    }

    showLoading(true);

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        showLoading(false);
        console.log('API 回傳原始資料:', data);

        // 檢查後端自訂錯誤格式
        if (data && data.result === 'error') {
          showCustomModal('取得題目失敗：' + data.message);
          return;
        }

        // 檢查資料是否為陣列，防止 data.forEach is not a function 錯誤
        if (!Array.isArray(data)) {
          showCustomModal('題目資料格式不正確，回傳內容非陣列');
          return;
        }

        showQuiz(data);
      })
      .catch(err => {
        showLoading(false);
        console.error('Fetch Error:', err);
        showCustomModal('網路連線失敗或後端回應異常：' + err.message);
      });
  }

  function showQuiz(data) {
    if (!data || data.length === 0) {
      showCustomModal('目前沒有可用的測驗題目');
      return;
    }

    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');

    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    data.forEach((q, index) => {
      const qNum = index + 1;
      let optionsHtml = '';
      const options = [q.optionA, q.optionB, q.optionC, q.optionD].filter(Boolean);

      options.forEach((opt, optIndex) => {
        optionsHtml += `
          <label class="option-label">
            <input type="radio" name="question_${qNum}" value="${optIndex + 1}">
            <span>${opt}</span>
          </label>
        `;
      });

      container.innerHTML += `
        <div class="question-card" id="q_card_${qNum}">
          <div class="question-title">${qNum}. ${q.question}</div>
          <div class="options-group">${optionsHtml}</div>
        </div>
      `;
    });
  }

  function submitQuiz() {
    showCustomModal('測驗已提交！', '成功');
  }
</script>

</body>
</html>
