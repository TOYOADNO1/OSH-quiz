<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職業安全衛生線上測驗</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333;
      --error-color: #d9534f;
      --success-color: #5cb85c;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .step-section { display: none; }
    .step-section.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="date"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button.btn:hover { opacity: 0.9; }
    
    /* 題目卡片優化 */
    .question-card {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary-color);
    }
    .question-title {
      font-weight: bold;
      margin-bottom: 12px;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
    }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .option-btn-label {
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      word-break: break-word;
      transition: all 0.2s ease;
    }
    .option-btn-label input {
      margin-top: 3px;
      flex-shrink: 0;
    }
    .option-btn-label:hover {
      background-color: #f0f7ff;
      border-color: #90caf9;
    }
    .option-btn-label:has(input:checked) {
      background-color: #e6f0fa;
      border-color: var(--primary-color);
      font-weight: bold;
    }
    .option-text {
      white-space: pre-wrap;
    }
    
    /* 檢討與錯題簽名專區 */
    .wrong-card {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .sig-canvas {
      border: 2px dashed #999;
      background: #fff;
      width: 100%;
      height: 120px;
      border-radius: 6px;
      touch-action: none;
      cursor: crosshair;
    }
    .clear-sig-btn {
      background: #888;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 5px;
    }

    /* 彈窗與 Loading */
    .custom-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .custom-modal-overlay.active { display: flex; }
    .custom-modal { background: white; padding: 20px; border-radius: 8px; max-width: 80%; width: 320px; text-align: center; }
    .modal-btn { margin-top: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <h2>職業安全衛生線上測驗</h2>

  <!-- 階段 1：填寫基本資料 -->
  <div id="step1" class="step-section active">
    <h3>階段 1：基本資料填寫</h3>
    <div class="form-group">
      <label for="classDate">上課日期 (必填)：</label>
      <input type="date" id="classDate">
    </div>
    <div class="form-group">
      <label for="department">部門名稱 (必填)：</label>
      <input type="text" id="department" placeholder="請輸入部門名稱">
    </div>
    <div class="form-group">
      <label for="userName">工號姓名 (必填)：</label>
      <input type="text" id="userName" placeholder="範例：A12345 張小明">
    </div>
    <div class="form-group">
      <label for="watchClass">是否已看過課程影片：</label>
      <select id="watchClass">
        <option value="">-- 請選擇 --</option>
        <option value="是">是</option>
        <option value="否">否</option>
      </select>
    </div>
    <button class="btn" onclick="startQuiz()">下一步：開始測驗</button>
  </div>

  <!-- 階段 2：進行 10 題線上測驗 -->
  <div id="step2" class="step-section">
    <h3>階段 2：線上測驗 (共 10 題)</h3>
    <div id="quizContainer"></div>
    <div class="form-group" style="margin-top: 20px;">
      <label for="feedback">建議與疑問 (非必填)：</label>
      <textarea id="feedback" rows="3" placeholder="若對題目或課程有疑問可在此填寫..."></textarea>
    </div>
    <button class="btn" onclick="submitQuiz()">提交測驗並計算成績</button>
  </div>

  <!-- 階段 3：測驗結果與錯題簽名 -->
  <div id="step3" class="step-section">
    <h3>階段 3：測驗結果與檢討</h3>
    <div id="scoreDisplay" style="font-size: 20px; font-weight: bold; margin-bottom: 15px; color: var(--primary-color);"></div>
    <div id="reviewContainer"></div>
    <button class="btn" id="sigSubmitBtn" onclick="submitSignature()">完成簽名並送出紀錄</button>
  </div>

  <!-- 階段 4：完成 -->
  <div id="step4" class="step-section">
    <h3>測驗完成</h3>
    <p style="color: var(--success-color); font-weight: bold; font-size: 18px;">恭喜您！您的測驗紀錄與確認簽名已成功寫入系統。</p>
    <p>感謝您的配合，您可以關閉此頁面。</p>
  </div>
</div>

<!-- 彈窗與 Loading -->
<div class="custom-modal-overlay" id="customModal">
  <div class="custom-modal">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-message" id="modalText">說明訊息</div>
    <button class="modal-btn" onclick="closeModal()">我知道了</button>
  </div>
</div>

<div id="loading" class="loading-overlay hidden">
  <div class="spinner"></div>
  <p style="margin-top: 10px; font-weight: bold;" id="loadingText">資料讀取中，請稍候...</p>
</div>

<script>
  const API_URL = 'https://q826t01.ector-7af.workers.dev/';

  let currentQuestions = []; // 存這 10 題
  let userAnswers = [];      // 測驗者答案
  let wrongItems = [];       // 錯題清單
  let submittedRowIndex = null;

  function showCustomModal(msg, title = '提示') {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalText').innerText = msg;
    document.getElementById('customModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('active');
  }

  function showLoading(show, text = '資料處理中，請稍候...') {
    const loading = document.getElementById('loading');
    document.getElementById('loadingText').innerText = text;
    if (show) loading.classList.remove('hidden');
    else loading.classList.add('hidden');
  }

  function switchStep(fromStep, toStep) {
    document.getElementById('step' + fromStep).classList.remove('active');
    document.getElementById('step' + toStep).classList.add('active');
    window.scrollTo(0, 0);
  }

  // 1. 驗證資料並從 Worker 撈選 10 題
  function startQuiz() {
    const classDate = document.getElementById('classDate').value;
    const department = document.getElementById('department').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const watchClass = document.getElementById('watchClass').value;

    if (!classDate || !department || !userName) {
      showCustomModal('請完整填寫：上課日期、部門名稱與工號姓名！');
      return;
    }
    if (!watchClass) {
      showCustomModal('請選擇是否已看過課程影片');
      return;
    }

    showLoading(true, '正在隨機抽出 10 道測驗題目...');

    fetch(API_URL + '?action=getQuestions')
      .then(res => res.json())
      .then(data => {
        showLoading(false);
        if (Array.isArray(data) && data.length > 0) {
          currentQuestions = data;
          renderQuiz(data);
          switchStep(1, 2);
        } else {
          showCustomModal('無法取得題目或題庫為空，請檢查「設計測驗題庫」工作表');
        }
      })
      .catch(err => {
        showLoading(false);
        showCustomModal('載入題目失敗：' + err.message);
      });
  }

  // 強化的 C 欄「題目內容」解析函式
  function parseQuestionContent(rawText) {
    if (!rawText) return { mainQuestion: '題目無內容', options: { A:'選項 A', B:'選項 B', C:'選項 C', D:'選項 D' } };

    const text = rawText.toString().trim();
    
    // 判斷是否包含 (A) 或 (a) 或 （A）
    const matchA = text.match(/[\(\（][Aa][\)\）]/);

    if (!matchA) {
      // 若無選項標記，顯示整段作為題目
      return {
        mainQuestion: text,
        options: { A: 'A', B: 'B', C: 'C', D: 'D' }
      };
    }

    // 擷取 (A) 之前的文字為主要題目
    const mainQuestion = text.substring(0, matchA.index).trim();
    const optionsText = text.substring(matchA.index).trim();

    // 剖析 A, B, C, D 區塊
    const regexA = /[\(\（][Aa][\)\）]\s*([\s\S]*?)(?=[\(\（][Bb][\)\）]|$)/;
    const regexB = /[\(\（][Bb][\)\）]\s*([\s\S]*?)(?=[\(\（][Cc][\)\）]|$)/;
    const regexC = /[\(\（][Cc][\)\）]\s*([\s\S]*?)(?=[\(\（][Dd][\)\）]|$)/;
    const regexD = /[\(\（][Dd][\)\）]\s*([\s\S]*?)$/;

    const matchOptA = optionsText.match(regexA);
    const matchOptB = optionsText.match(regexB);
    const matchOptC = optionsText.match(regexC);
    const matchOptD = optionsText.match(regexD);

    return {
      mainQuestion: mainQuestion || text,
      options: {
        A: matchOptA ? '(A) ' + matchOptA[1].trim() : '(A)',
        B: matchOptB ? '(B) ' + matchOptB[1].trim() : '(B)',
        C: matchOptC ? '(C) ' + matchOptC[1].trim() : '(C)',
        D: matchOptD ? '(D) ' + matchOptD[1].trim() : '(D)'
      }
    };
  }

  // 渲染 10 題題目與選項
  function renderQuiz(questions) {
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    questions.forEach((q, idx) => {
      const qIndex = idx + 1;
      const parsed = parseQuestionContent(q.question);
      
      // 保存清洗後的純題目文字，以供錯題檢討區使用
      q.cleanQuestion = parsed.mainQuestion;

      container.innerHTML += `
        <div class="question-card">
          <div class="question-title">${qIndex}. ${parsed.mainQuestion}</div>
          <div class="options-group">
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="A">
              <span class="option-text">${parsed.options.A}</span>
            </label>
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="B">
              <span class="option-text">${parsed.options.B}</span>
            </label>
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="C">
              <span class="option-text">${parsed.options.C}</span>
            </label>
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="D">
              <span class="option-text">${parsed.options.D}</span>
            </label>
          </div>
        </div>
      `;
    });
  }

  // 2. 提交測驗 (寫入 A~J 欄)
  function submitQuiz() {
    userAnswers = [];
    wrongItems = [];
    let correctCount = 0;

    for (let i = 1; i <= currentQuestions.length; i++) {
      const selected = document.querySelector(`input[name="q_${i}"]:checked`);
      if (!selected) {
        showCustomModal(`請回答第 ${i} 題！`);
        return;
      }
      const uAns = selected.value;
      userAnswers.push(uAns);

      const qObj = currentQuestions[i - 1];
      if (uAns === qObj.answer) {
        correctCount++;
      } else {
        wrongItems.push({
          quizNum: i,
          bankId: qObj.bankId,
          userAns: uAns,
          correctAns: qObj.answer,
          question: qObj.cleanQuestion || qObj.question
        });
      }
    }

    const accuracy = (correctCount / currentQuestions.length) * 100;
    const accuracyStr = accuracy.toFixed(1) + "%";
    const score = Math.round(accuracy);

    const rawDate = document.getElementById('classDate').value;
    const formattedClassDate = rawDate.replace(/-/g, '/');

    const payload = {
      action: 'submitQuiz',
      classDate: formattedClassDate,
      department: document.getElementById('department').value.trim(),
      userName: document.getElementById('userName').value.trim(),
      bankIds: currentQuestions.map(q => q.bankId),
      correctAnswers: currentQuestions.map(q => q.answer),
      userAnswers: userAnswers,
      accuracyStr: accuracyStr,
      score: score,
      feedback: document.getElementById('feedback').value.trim()
    };

    showLoading(true, '正在提交測驗答案...');

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(resData => {
      showLoading(false);
      if (resData.status === 'success') {
        submittedRowIndex = resData.rowIndex;
        renderReviewSection(score, accuracyStr);
        switchStep(2, 3);
      } else {
        showCustomModal('寫入失敗：' + resData.message);
      }
    })
    .catch(err => {
      showLoading(false);
      showCustomModal('網路錯誤：' + err.message);
    });
  }

  // 3. 渲染檢討與錯題簽名區域
  function renderReviewSection(score, accuracyStr) {
    document.getElementById('scoreDisplay').innerText = `您的測驗得分：${score} 分 (答對率：${accuracyStr})`;
    const container = document.getElementById('reviewContainer');
    container.innerHTML = '';

    if (wrongItems.length === 0) {
      container.innerHTML = `<p style="color:var(--success-color); font-weight:bold; font-size: 16px;">恭喜您全對！無需進行錯題簽名。</p>`;
      document.getElementById('sigSubmitBtn').innerText = "確認送出";
      return;
    }

    const userName = document.getElementById('userName').value.trim();
    let html = `<p style="color:var(--error-color); font-weight:bold; font-size: 15px;">您有 ${wrongItems.length} 題答錯。請針對下列錯題進行檢討，並於每題下方逐條簽上您的完整工號姓名「${userName}」以示確認：</p>`;

    wrongItems.forEach((item, index) => {
      html += `
        <div class="wrong-card">
          <p><strong>錯題 ${index + 1} (測驗第 ${item.quizNum} 題 / 題庫第 ${item.bankId} 題)：</strong></p>
          <p style="white-space: pre-wrap; font-size: 15px;">${item.question}</p>
          <p style="color:var(--error-color); font-weight: bold;">您的回答：${item.userAns} ❌ ｜ 正確答案：${item.correctAns}  </p>
          <label style="margin-top:10px;">請簽寫「${userName}」：</label>
          <canvas id="canvas_${index}" class="sig-canvas"></canvas>
          <button class="clear-sig-btn" onclick="clearCanvas(${index})">清除重簽</button>
        </div>
      `;
    });

    container.innerHTML = html;
    setTimeout(initCanvases, 100);
  }

  // 初始化手寫簽名板
  let canvasContexts = [];
  function initCanvases() {
    canvasContexts = [];
    wrongItems.forEach((_, idx) => {
      const cvs = document.getElementById(`canvas_${idx}`);
      if (!cvs) return;
      
      cvs.width = cvs.offsetWidth;
      cvs.height = cvs.offsetHeight;
      const ctx = cvs.getContext('2d');
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#000';
      canvasContexts[idx] = { cvs, ctx, isSigned: false };

      let drawing = false;

      function startDraw(e) {
        drawing = true;
        canvasContexts[idx].isSigned = true;
        ctx.beginPath();
        const pos = getPos(e, cvs);
        ctx.moveTo(pos.x, pos.y);
      }
      function moveDraw(e) {
        if (!drawing) return;
        const pos = getPos(e, cvs);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }
      function endDraw() { drawing = false; }

      cvs.addEventListener('mousedown', startDraw);
      cvs.addEventListener('mousemove', moveDraw);
      cvs.addEventListener('mouseup', endDraw);

      cvs.addEventListener('touchstart', (e) => { startDraw(e.touches[0]); e.preventDefault(); });
      cvs.addEventListener('touchmove', (e) => { moveDraw(e.touches[0]); e.preventDefault(); });
      cvs.addEventListener('touchend', endDraw);
    });
  }

  function getPos(e, cvs) {
    const rect = cvs.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function clearCanvas(idx) {
    const item = canvasContexts[idx];
    if (item) {
      item.ctx.clearRect(0, 0, item.cvs.width, item.cvs.height);
      item.isSigned = false;
    }
  }

  // 4. 提交簽名 (寫入 K~L 欄)
  function submitSignature() {
    if (wrongItems.length > 0) {
      for (let i = 0; i < wrongItems.length; i++) {
        if (!canvasContexts[i] || !canvasContexts[i].isSigned) {
          showCustomModal(`請完成第 ${i + 1} 道錯題的確認簽名！`);
          return;
        }
      }
    }

    const signatureLogArr = wrongItems.map(item => {
      return `${item.bankId}(${item.userAns}->${item.correctAns})..測驗[${item.quizNum}]`;
    });
    const signatureLogStr = signatureLogArr.join(',');

    showLoading(true, '正在寫入確認簽名紀錄...');

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitSignature',
        rowIndex: submittedRowIndex,
        signatureLog: signatureLogStr
      })
    })
    .then(res => res.json())
    .then(resData => {
      showLoading(false);
      if (resData.status === 'success') {
        switchStep(3, 4);
      } else {
        showCustomModal('簽名提交失敗：' + resData.message);
      }
    })
    .catch(err => {
      showLoading(false);
      showCustomModal('網路錯誤：' + err.message);
    });
  }
</script>

</body>
</html>
