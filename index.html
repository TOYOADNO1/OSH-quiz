<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職業安全衛生線上測驗</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333;
      --error-color: #d9534f;
      --success-color: #5cb85c;
    }
    body {
      font-family: "Microsoft JhengHei", "微軟正黑體", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .step-section { display: none; }
    .step-section.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="date"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }
    button.btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }
    button.btn:hover { opacity: 0.9; }
    
    .question-card {
      background: #f9f9f9;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary-color);
    }
    .question-title {
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
    }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn-label {
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      padding: 12px 15px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      word-break: break-word;
      transition: all 0.2s ease;
    }
    .option-btn-label input {
      margin-top: 3px;
      flex-shrink: 0;
    }
    .option-btn-label:hover {
      background-color: #f0f7ff;
      border-color: #90caf9;
    }
    .option-btn-label:has(input:checked) {
      background-color: #e6f0fa;
      border-color: var(--primary-color);
      font-weight: bold;
    }
    
    .wrong-card {
      background: #fff0f0;
      border: 1px solid #ffcdd2;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .signature-box {
      margin-top: 25px;
      padding: 15px;
      background: #fdfdfd;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
    }

    .sig-canvas {
      border: 2px dashed #999;
      background: #fff;
      width: 100%;
      height: 140px;
      border-radius: 6px;
      touch-action: none;
      cursor: crosshair;
    }

    .clear-sig-btn {
      background: #888;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }

    .custom-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .custom-modal-overlay.active { display: flex; }
    .custom-modal { background: white; padding: 20px; border-radius: 8px; max-width: 80%; width: 320px; text-align: center; }
    .modal-btn { margin-top: 15px; padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; }
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <h2>職業安全衛生線上測驗</h2>

  <!-- 階段 1：填寫基本資料 -->
  <div id="step1" class="step-section active">
    <h3>階段 1：基本資料填寫</h3>
    <div class="form-group">
      <label for="classDate">上課日期 (必填)：</label>
      <input type="date" id="classDate">
    </div>
    <div class="form-group">
      <label for="department">部門名稱 (必填)：</label>
      <input type="text" id="department" placeholder="請輸入部門名稱">
    </div>
    <div class="form-group">
      <label for="userName">工號姓名 (必填)：</label>
      <input type="text" id="userName" placeholder="範例：A12345 張小明">
    </div>
    <div class="form-group">
      <label for="watchClass">是否已看過課程影片：</label>
      <select id="watchClass">
        <option value="">-- 請選擇 --</option>
        <option value="是">是</option>
        <option value="否">否</option>
      </select>
    </div>
    <button class="btn" onclick="startQuiz()">下一步：開始測驗</button>
  </div>

  <!-- 階段 2：進行 10 題線上測驗 -->
  <div id="step2" class="step-section">
    <h3>階段 2：線上測驗 (共 10 題)</h3>
    <div id="quizContainer"></div>
    <div class="form-group" style="margin-top: 20px;">
      <label for="feedback">建議與疑問 (非必填)：</label>
      <textarea id="feedback" rows="3" placeholder="若對題目或課程有疑問可在此填寫..."></textarea>
    </div>
    <button class="btn" onclick="submitQuiz()">提交測驗並計算成績</button>
  </div>

  <!-- 階段 3：測驗結果與錯題檢討 + 簽名 -->
  <div id="step3" class="step-section">
    <h3>階段 3：測驗結果與檢討</h3>
    <div id="scoreDisplay" style="font-size: 20px; font-weight: bold; margin-bottom: 15px; color: var(--primary-color);"></div>
    <div id="reviewContainer"></div>

    <!-- 提交前的簽名板區塊 -->
    <div class="signature-box">
      <label for="finalCanvas" style="font-size: 16px;">請最後確認簽名：</label>
      <canvas id="finalCanvas" class="sig-canvas"></canvas>
      <button class="clear-sig-btn" onclick="clearFinalCanvas()">清除重簽</button>
    </div>

    <button class="btn" id="sigSubmitBtn" onclick="submitSignature()">完成簽名並送出紀錄</button>
  </div>

  <!-- 階段 4：完成 -->
  <div id="step4" class="step-section">
    <h3>測驗完成</h3>
    <p style="color: var(--success-color); font-weight: bold; font-size: 18px;">恭喜您！您的測驗紀錄、錯題檢討與確認簽名已成功寫入系統。</p>
    <p>感謝您的配合，您可以關閉此頁面。</p>
  </div>
</div>

<!-- 彈窗與 Loading -->
<div class="custom-modal-overlay" id="customModal">
  <div class="custom-modal">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-message" id="modalText">說明訊息</div>
    <button class="modal-btn" onclick="closeModal()">我知道了</button>
  </div>
</div>

<div id="loading" class="loading-overlay hidden">
  <div class="spinner"></div>
  <p style="margin-top: 10px; font-weight: bold;" id="loadingText">資料讀取中，請稍候...</p>
</div>

<script>
  const API_URL = 'https://q826t01.ector-7af.workers.dev/';

  let currentQuestions = []; 
  let userAnswers = [];      
  let wrongItems = [];        
  let submittedRowIndex = null;
  
  let finalCanvasCtx = null;
  let isFinalCanvasSigned = false;

  function showCustomModal(msg, title = '提示') {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalText').innerText = msg;
    document.getElementById('customModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('active');
  }

  function showLoading(show, text = '資料處理中，請稍候...') {
    const loading = document.getElementById('loading');
    document.getElementById('loadingText').innerText = text;
    if (show) loading.classList.remove('hidden');
    else loading.classList.add('hidden');
  }

  function switchStep(fromStep, toStep) {
    document.getElementById('step' + fromStep).classList.remove('active');
    document.getElementById('step' + toStep).classList.add('active');
    window.scrollTo(0, 0);
  }

  function startQuiz() {
    const classDate = document.getElementById('classDate').value;
    const department = document.getElementById('department').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const watchClass = document.getElementById('watchClass').value;

    if (!classDate || !department || !userName) {
      showCustomModal('請完整填寫：上課日期、部門名稱與工號姓名！');
      return;
    }
    if (!watchClass) {
      showCustomModal('請選擇是否已看過課程影片');
      return;
    }

    showLoading(true, '正在隨機抽出 10 道測驗題目...');

    fetch(API_URL + '?action=getQuestions')
      .then(res => res.json())
      .then(data => {
        showLoading(false);
        if (Array.isArray(data) && data.length > 0) {
          currentQuestions = data;
          renderQuiz(data);
          switchStep(1, 2);
        } else {
          showCustomModal('無法取得題目或題庫為空，請檢查「設計測驗題庫」工作表');
        }
      })
      .catch(err => {
        showLoading(false);
        showCustomModal('載入題目失敗：' + err.message);
      });
  }

  // 拆解題目與選項內容
  function parseQuestionContent(qObj) {
    let rawText = qObj.question || qObj.questionContent || qObj.content || qObj.title || '';
    
    if (typeof rawText !== 'string') {
      rawText = JSON.stringify(rawText);
    }

    let text = rawText.replace(/（/g, '(').replace(/）/g, ')').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();

    const matchA = text.match(/\([Aa]\)/);

    if (!matchA) {
      return {
        mainQuestion: text,
        options: { A: '(A) 選項 A', B: '(B) 選項 B', C: '(C) 選項 C', D: '(D) 選項 D' }
      };
    }

    const mainQuestion = text.substring(0, matchA.index).replace(/\n+/g, ' ').trim();
    const optionsBlock = text.substring(matchA.index);

    const regex = /\(([A-Da-d])\)\s*([\s\S]*?)(?=\([A-Da-d]\)|$)/g;
    let match;
    const opts = {};

    while ((match = regex.exec(optionsBlock)) !== null) {
      const key = match[1].toUpperCase();
      const val = match[2].replace(/\n+/g, ' ').trim();
      opts[key] = `(${key}) ${val}`;
    }

    return {
      mainQuestion: mainQuestion || '題目內容',
      options: {
        A: opts.A || '(A)',
        B: opts.B || '(B)',
        C: opts.C || '(C)',
        D: opts.D || '(D)'
      }
    };
  }

  function renderQuiz(questions) {
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    questions.forEach((q, idx) => {
      const qIndex = idx + 1;
      const parsed = parseQuestionContent(q);
      
      q.cleanQuestion = parsed.mainQuestion;

      container.innerHTML += `
        <div class="question-card">
          <div class="question-title">${qIndex}. ${parsed.mainQuestion}</div>
          <div class="options-group">
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="A">
              <span>${parsed.options.A}</span>
            </label>
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="B">
              <span>${parsed.options.B}</span>
            </label>
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="C">
              <span>${parsed.options.C}</span>
            </label>
            <label class="option-btn-label">
              <input type="radio" name="q_${qIndex}" value="D">
              <span>${parsed.options.D}</span>
            </label>
          </div>
        </div>
      `;
    });
  }

  function submitQuiz() {
    userAnswers = [];
    wrongItems = [];
    let correctCount = 0;

    for (let i = 1; i <= currentQuestions.length; i++) {
      const selected = document.querySelector(`input[name="q_${i}"]:checked`);
      if (!selected) {
        showCustomModal(`請回答第 ${i} 題！`);
        return;
      }
      const uAns = selected.value;
      userAnswers.push(uAns);

      const qObj = currentQuestions[i - 1];
      if (uAns === qObj.answer) {
        correctCount++;
      } else {
        wrongItems.push({
          quizNum: i,
          bankId: qObj.bankId,
          userAns: uAns,
          correctAns: qObj.answer,
          question: qObj.cleanQuestion || qObj.question
        });
      }
    }

    const accuracy = (correctCount / currentQuestions.length) * 100;
    const accuracyStr = accuracy.toFixed(1) + "%";
    const score = Math.round(accuracy);

    const rawDate = document.getElementById('classDate').value;
    const formattedClassDate = rawDate.replace(/-/g, '/');

    const payload = {
      action: 'submitQuiz',
      classDate: formattedClassDate,
      department: document.getElementById('department').value.trim(),
      userName: document.getElementById('userName').value.trim(),
      watchClass: document.getElementById('watchClass').value,
      bankIds: currentQuestions.map(q => q.bankId),
      correctAnswers: currentQuestions.map(q => q.answer),
      userAnswers: userAnswers,
      accuracyStr: accuracyStr,
      score: score,
      feedback: document.getElementById('feedback').value.trim()
    };

    showLoading(true, '正在提交測驗答案...');

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(resData => {
      showLoading(false);
      if (resData.status === 'success') {
        submittedRowIndex = resData.rowIndex;
        renderReviewSection(score, accuracyStr);
        switchStep(2, 3);
      } else {
        showCustomModal('寫入失敗：' + resData.message);
      }
    })
    .catch(err => {
      showLoading(false);
      showCustomModal('網路錯誤：' + err.message);
    });
  }

  function renderReviewSection(score, accuracyStr) {
    document.getElementById('scoreDisplay').innerText = `您的測驗得分：${score} 分 (答對率：${accuracyStr})`;
    const container = document.getElementById('reviewContainer');
    container.innerHTML = '';

    if (wrongItems.length === 0) {
      container.innerHTML = `<p style="color:var(--success-color); font-weight:bold; font-size: 16px;">恭喜您全對！無需填寫錯題檢討。</p>`;
    } else {
      let html = `<p style="color:var(--error-color); font-weight:bold; font-size: 15px;">您有 ${wrongItems.length} 題答錯。請於下方說明錯題原因與檢討心得：</p>`;

      wrongItems.forEach((item, index) => {
        html += `
          <div class="wrong-card">
            <p><strong>錯題 ${index + 1} (測驗第 ${item.quizNum} 題 / 題庫第 ${item.bankId} 題)：</strong></p>
            <p style="font-size: 15px;">${item.question}</p>
            <p style="color:var(--error-color); font-weight: bold;">您的回答：${item.userAns} ❌ ｜ 正確答案：${item.correctAns}</p>
            <div class="form-group" style="margin-top: 10px;">
              <label for="review_reason_${index}">錯題檢討與說明 (必填)：</label>
              <textarea id="review_reason_${index}" rows="2" placeholder="請填寫此題答錯原因或觀念檢討..."></textarea>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    setTimeout(initFinalCanvas, 100);
  }

  // 初始化單一簽名板
  function initFinalCanvas() {
    const cvs = document.getElementById('finalCanvas');
    if (!cvs) return;

    cvs.width = cvs.offsetWidth;
    cvs.height = cvs.offsetHeight;
    
    finalCanvasCtx = cvs.getContext('2d');
    finalCanvasCtx.lineWidth = 3;
    finalCanvasCtx.strokeStyle = '#000';
    isFinalCanvasSigned = false;

    let drawing = false;

    function startDraw(e) {
      drawing = true;
      isFinalCanvasSigned = true;
      finalCanvasCtx.beginPath();
      const pos = getPos(e, cvs);
      finalCanvasCtx.moveTo(pos.x, pos.y);
    }

    function moveDraw(e) {
      if (!drawing) return;
      const pos = getPos(e, cvs);
      finalCanvasCtx.lineTo(pos.x, pos.y);
      finalCanvasCtx.stroke();
    }

    function endDraw() {
      drawing = false;
    }

    cvs.addEventListener('mousedown', startDraw);
    cvs.addEventListener('mousemove', moveDraw);
    cvs.addEventListener('mouseup', endDraw);

    cvs.addEventListener('touchstart', (e) => { startDraw(e.touches[0]); e.preventDefault(); });
    cvs.addEventListener('touchmove', (e) => { moveDraw(e.touches[0]); e.preventDefault(); });
    cvs.addEventListener('touchend', endDraw);
  }

  function getPos(e, cvs) {
    const rect = cvs.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function clearFinalCanvas() {
    const cvs = document.getElementById('finalCanvas');
    if (cvs && finalCanvasCtx) {
      finalCanvasCtx.clearRect(0, 0, cvs.width, cvs.height);
      isFinalCanvasSigned = false;
    }
  }

  function submitSignature() {
    // 檢查錯題檢討輸入框
    let reviewNotesArr = [];
    if (wrongItems.length > 0) {
      for (let i = 0; i < wrongItems.length; i++) {
        const inputVal = document.getElementById(`review_reason_${i}`).value.trim();
        if (!inputVal) {
          showCustomModal(`請完整填寫第 ${i + 1} 道錯題的檢討內容！`);
          return;
        }
        reviewNotesArr.push(`[錯題${wrongItems[i].quizNum}(題號${wrongItems[i].bankId})]: ${inputVal}`);
      }
    }

    // 檢查簽名板
    if (!isFinalCanvasSigned) {
      showCustomModal('請於下方畫布完成手寫簽名後再送出！');
      return;
    }

    const cvs = document.getElementById('finalCanvas');
    const signatureDataUrl = cvs.toDataURL('image/png');
    const reviewSummaryStr = reviewNotesArr.join('； ') || '無錯題';

    showLoading(true, '正在寫入檢討紀錄與確認簽名...');

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitSignature',
        rowIndex: submittedRowIndex,
        reviewNotes: reviewSummaryStr,
        signatureData: signatureDataUrl
      })
    })
    .then(res => res.json())
    .then(resData => {
      showLoading(false);
      if (resData.status === 'success') {
        switchStep(3, 4);
      } else {
        showCustomModal('提交失敗：' + resData.message);
      }
    })
    .catch(err => {
      showLoading(false);
      showCustomModal('網路錯誤：' + err.message);
    });
  }
</script>

</body>
</html>
